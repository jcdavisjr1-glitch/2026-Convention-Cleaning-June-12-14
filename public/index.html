<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e40af">
  <title>Cleaning Dashboard — 2026 Convention</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="dash-header">
    <h1>🧹 2026 Convention — Cleaning Dashboard</h1>
    <div class="dash-meta">Plant City Assembly Hall &nbsp;|&nbsp; June 12–14, 2026</div>
    <div class="dash-contact">Overseer: Clifton Davis &nbsp;·&nbsp; 727-278-7454</div>
  </header>

  <!-- Team strip -->
  <div class="overseer-strip">
    <div class="overseer-person"><strong>Pierson Mims</strong> · 727-439-4490 · Zones 1, 2 &amp; 7 (Asgn A &amp; B)</div>
    <div class="overseer-person"><strong>Harold Taylor</strong> · 727-808-8547 · Zones 4, 5 &amp; 6 (Asgn C, D &amp; E)</div>
    <div class="overseer-person"><strong>Matt Harris</strong> · 407-462-2629 · Zones 3 &amp; 8</div>
  </div>

  <div class="dash-body">
    <div id="dashContent">
      <div class="center-page">
        <div style="font-size:2rem">⏳</div>
        <h2>Loading…</h2>
      </div>
    </div>
    <div class="refresh-footer" id="refreshFooter"></div>
  </div>

<script>
(function () {
  const DAYS = [
    { key: 'fri', label: 'Friday, June 12', codes: ['fri-a','fri-b','fri-c','fri-d','fri-e'] },
    { key: 'sat', label: 'Saturday, June 13', codes: ['sat-a','sat-b','sat-c','sat-d','sat-e'] },
    { key: 'sun', label: 'Sunday, June 14 ★ End-of-Convention Cleanup', codes: ['sun-a','sun-b','sun-c','sun-d','sun-e'], isSunday: true }
  ];

  function copyLink(code) {
    const url = `${location.origin}/checklist.html?code=${code}`;
    navigator.clipboard.writeText(url).then(() => {
      const el = document.getElementById('copy-' + code);
      if (el) { el.textContent = '✓ Copied!'; setTimeout(() => { el.textContent = 'Copy link'; }, 1800); }
    });
  }

  function formatTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York'
    });
  }

  function renderDashboard(status) {
    const container = document.getElementById('dashContent');
    container.innerHTML = '';

    DAYS.forEach(day => {
      const block = document.createElement('div');
      block.className = 'day-block';

      const heading = document.createElement('div');
      heading.className = 'day-heading';
      heading.innerHTML = day.label + (day.isSunday ? ' <span class="day-sunday-tag">MAJOR CLEANUP</span>' : '');
      block.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'cards-grid';

      day.codes.forEach(code => {
        const d = status[code];
        if (!d) return;

        let cardClass = 'asgn-card';
        let chipClass = 'chip-none';
        let chipLabel = 'Not Started';

        if (d.completed) {
          cardClass += ' complete';
          chipClass = 'chip-done';
          chipLabel = '✓ Complete';
        } else if (d.inProgress) {
          cardClass += ' in-progress';
          chipClass = 'chip-progress';
          chipLabel = 'In Progress';
        }

        const progressText = d.completed
          ? `All ${d.totalTasks} tasks done`
          : `${d.checkedCount} / ${d.totalTasks} tasks`;

        const captainLine = d.captain
          ? `<div class="card-captain">Capt: ${d.captain}</div>`
          : `<div class="card-captain" style="color:#9ca3af">Captain: TBD</div>`;

        const completedLine = d.completed && d.completedBy
          ? `<div class="card-completed-by">✓ ${d.completedBy}${d.completedAt ? ' · ' + formatTime(d.completedAt) : ''}</div>`
          : '';

        const card = document.createElement('div');
        card.className = cardClass;
        card.innerHTML = `
          <div class="card-congregation">${d.congregation}</div>
          <div class="card-area">${d.area}</div>
          <span class="card-status-chip ${chipClass}">${chipLabel}</span>
          <div class="card-progress-text">${progressText}</div>
          ${captainLine}
          ${completedLine}
          <a class="card-link" href="/checklist.html?code=${code}" target="_blank">Open checklist ↗</a>
          <a class="card-link" href="#" id="copy-${code}" onclick="event.preventDefault(); copyLink('${code}')">Copy link</a>
          ${(d.completed || d.inProgress) ? `<a class="card-link" style="color:#dc2626" href="#" onclick="event.preventDefault(); resetAssignment('${code}', '${d.congregation}')">↺ Reset</a>` : ''}
        `;

        grid.appendChild(card);
      });

      block.appendChild(grid);
      container.appendChild(block);
    });

    // Overall summary
    const all = Object.values(status);
    const total = all.length;
    const done = all.filter(d => d.completed).length;
    const inProg = all.filter(d => d.inProgress).length;

    const summary = document.createElement('div');
    summary.style.cssText = 'background:#fff;border-radius:12px;padding:1rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:1.5rem;';
    summary.innerHTML = `
      <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin-bottom:.5rem">Overall Progress</div>
      <div style="font-size:1.5rem;font-weight:800;color:#15803d">${done} <span style="color:#9ca3af;font-size:1rem;font-weight:600">/ ${total} complete</span></div>
      ${inProg > 0 ? `<div style="font-size:.8rem;color:#b45309;margin-top:.25rem">${inProg} in progress</div>` : ''}
    `;
    container.insertBefore(summary, container.firstChild);
  }

  // Track known completed assignments to detect new completions
  let knownCompleted = new Set();
  let firstLoad = true;

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523, 659, 784].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = freq;
        o.type = 'sine';
        g.gain.setValueAtTime(0, ctx.currentTime + i * 0.18);
        g.gain.linearRampToValueAtTime(0.35, ctx.currentTime + i * 0.18 + 0.05);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.18 + 0.4);
        o.start(ctx.currentTime + i * 0.18);
        o.stop(ctx.currentTime + i * 0.18 + 0.5);
      });
    } catch(e) {}
  }

  function checkForNewCompletions(status) {
    if (firstLoad) {
      Object.values(status).forEach(d => { if (d.completed) knownCompleted.add(d.code); });
      firstLoad = false;
      return;
    }
    const newlyDone = Object.values(status).filter(d => d.completed && !knownCompleted.has(d.code));
    if (newlyDone.length > 0) {
      playChime();
      newlyDone.forEach(d => {
        knownCompleted.add(d.code);
        // Flash the card
        setTimeout(() => {
          const cards = document.querySelectorAll('.asgn-card.complete');
          cards.forEach(card => {
            if (card.innerHTML.includes(d.congregation)) {
              card.style.transition = 'background 0.3s';
              card.style.background = '#bbf7d0';
              setTimeout(() => card.style.background = '', 2000);
            }
          });
        }, 100);
      });
      // Show a banner
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#15803d;color:#fff;text-align:center;padding:.875rem;font-weight:700;font-size:1rem;z-index:999;animation:slideDown .3s ease';
      banner.textContent = `✅ ${newlyDone.map(d => d.congregation).join(', ')} — Assignment Complete!`;
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 5000);
    }
  }

  function load() {
    fetch('/api/status')
      .then(r => r.json())
      .then(status => {
        checkForNewCompletions(status);
        renderDashboard(status);
        const footer = document.getElementById('refreshFooter');
        footer.textContent = `Last updated: ${new Date().toLocaleTimeString()} · Auto-refreshes every 15 seconds`;
      })
      .catch(err => {
        console.error(err);
        document.getElementById('dashContent').innerHTML =
          '<div class="center-page"><h2>Error loading data</h2><p>Check your connection and refresh.</p></div>';
      });
  }

  function resetAssignment(code, congregation) {
    if (!confirm(`Reset ${congregation}?\n\nThis will clear all checked tasks and the completion status. This cannot be undone.`)) return;
    fetch(`/api/reset/${code}`, { method: 'POST' })
      .then(r => r.json())
      .then(() => load())
      .catch(() => alert('Reset failed — please try again.'));
  }

  // Make functions global
  window.copyLink = copyLink;
  window.resetAssignment = resetAssignment;

  load();
  setInterval(load, 15000);
})();
</script>
</body>
</html>
